version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      monthly-batch:
        patterns:
          - '*'

  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      monthly-batch:
        patterns:
          - '*'
    # Never propose major version bumps for Python deps. Runtime pins are
    # compatible-release (~=) ranges and major upgrades are deliberate,
    # human-driven changes (e.g. Django LTS bumps).
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
