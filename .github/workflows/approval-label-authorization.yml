name: Approval label authorization

on:
  workflow_run:
    workflows: ["Approval label authorization event gate"]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  approval-label-authorization:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve current pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            let numbers = (run.pull_requests || [])
              .map((pullRequest) => pullRequest.number)
              .filter((number) => Number.isInteger(number));

            if (numbers.length === 0 && run.head_sha) {
              const repositories = [];
              if (run.head_repository?.owner?.login && run.head_repository?.name) {
                repositories.push({
                  owner: run.head_repository.owner.login,
                  repo: run.head_repository.name,
                });
              }
              repositories.push({ owner: context.repo.owner, repo: context.repo.repo });

              for (const target of repositories) {
                const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...target,
                  commit_sha: run.head_sha,
                });
                numbers.push(
                  ...response.data
                    .filter((pullRequest) => pullRequest.base?.repo?.full_name === repository)
                    .map((pullRequest) => pullRequest.number),
                );
                if (numbers.length > 0) {
                  break;
                }
              }
            }

            for (const number of numbers) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              const pullRequest = response.data;
              if (
                pullRequest.state === 'open' &&
                pullRequest.base.repo.full_name === repository
              ) {
                core.setOutput('number', String(pullRequest.number));
                break;
              }
            }

      - name: Create GitHub App installation token
        id: app-token
        if: steps.pr.outputs.number != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        continue-on-error: true
        with:
          client-id: ${{ vars.ANSIBLE_ORG_MEMBERS_READ_ONLY_APP_CLIENT_ID }}
          private-key: ${{ secrets.ANSIBLE_ORG_MEMBERS_READ_ONLY_APP_PRIVATE_KEY }}
          owner: ansible
          permission-members: read

      - name: Verify the approval label actor
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LABEL_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" != "workflow_run" ]]; then
            echo "::error::Expected workflow_run; received '${EVENT_NAME}'."
            exit 1
          fi

          api_root="repos/${REPOSITORY}/issues/${PR_NUMBER}"
          label_name="breaking-change-approved"
          marker_prefix="<!-- approval-label-authorization:v1 label_event_id="

          label_events() {
            GH_TOKEN="${LABEL_TOKEN}" gh api --paginate \
              "${api_root}/timeline" \
              | jq -s --arg label "$label_name" \
                '[.[][] | select((.event == "labeled" or .event == "unlabeled") and .label.name == $label)] | sort_by(.created_at)'
          }

          has_label() {
            local labels
            labels=$(GH_TOKEN="${LABEL_TOKEN}" gh api --paginate \
              "${api_root}/labels" --jq '.[].name') || return 2
            printf '%s\n' "${labels}" | grep -Fqx -- "${label_name}"
          }

          has_marker() {
            local event_id="$1"
            local marker="${marker_prefix}${event_id} -->"
            GH_TOKEN="${LABEL_TOKEN}" gh api --paginate \
              "${api_root}/comments" \
              | jq -s --arg marker "$marker" \
                '[.[][] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | length > 0' \
              | grep -qx true
          }

          write_marker() {
            local event_id="$1"
            local marker="${marker_prefix}${event_id} -->"
            GH_TOKEN="${LABEL_TOKEN}" gh api --method POST \
              "${api_root}/comments" \
              -f "body=Approval label authorization verified by the workflow. ${marker}" >/dev/null
          }

          check_membership() {
            local actor="$1"
            [[ -n "${GH_TOKEN}" ]] || return 2
            local membership
            membership=$(GH_TOKEN="${GH_TOKEN}" gh api \
              "orgs/ansible/teams/ansible-staff-eng-leads/memberships/${actor}" \
              --jq '.state') || return 2
            [[ "${membership}" == "active" ]]
          }

          remove_label() {
            GH_TOKEN="${LABEL_TOKEN}" gh api --method DELETE \
              "${api_root}/labels/${label_name}" >/dev/null
          }

          fail_closed_remove() {
            echo "::error::$1"
            if remove_label; then
              echo "::notice::Removed the approval label while failing closed."
            else
              echo "::error::Could not remove the approval label; the check remains failed."
            fi
            exit 1
          }

          restore_label() {
            GH_TOKEN="${LABEL_TOKEN}" gh api --method POST \
              "${api_root}/labels" -f "labels[]=${label_name}" >/dev/null || return 1
            has_label
          }

          mark_restored_label_event() {
            local previous_event_id="$1"
            local events event_id event_action event_actor
            events=$(label_events) || return 1
            event_id=$(jq -r 'last | .id // empty' <<<"${events}")
            event_action=$(jq -r 'last | .event // empty' <<<"${events}")
            event_actor=$(jq -r 'last | .actor.login // empty' <<<"${events}")
            [[ "${event_action}" == "labeled" && "${event_actor}" == "github-actions[bot]" && -n "${event_id}" && "${event_id}" != "${previous_event_id}" ]] || return 1
            write_marker "${event_id}"
          }

          current_label_state="absent"
          if has_label; then
            current_label_state="present"
          else
            label_query_status=$?
            if [[ "${label_query_status}" -ne 1 ]]; then
              echo "::error::Could not inspect the current PR labels."
              exit 1
            fi
          fi

          events=$(label_events) || {
            echo "::error::Could not inspect approval-label history."
            exit 1
          }
          latest_event=$(jq -c 'last // {}' <<<"${events}")
          latest_action=$(jq -r '.event // empty' <<<"${latest_event}")
          latest_event_id=$(jq -r '.id // empty' <<<"${latest_event}")
          latest_actor=$(jq -r '.actor.login // empty' <<<"${latest_event}")

          if [[ "${current_label_state}" == "absent" ]]; then
            if [[ "${latest_action}" != "unlabeled" ]]; then
              echo "::notice::The approval label is absent; no current approval needs authorization."
              exit 0
            fi

            prior_event_id=$(jq -r '[.[] | select(.event == "labeled")][-1].id // empty' <<<"${events}")
            if [[ -n "${prior_event_id}" ]] && has_marker "${prior_event_id}"; then
              if ! check_membership "${latest_actor}"; then
                if restore_label && mark_restored_label_event "${prior_event_id}"; then
                  echo "::notice::Restored the previously authorized approval after an unauthorized or unverifiable removal."
                  exit 0
                fi
                echo "::error::Could not safely restore and mark the authorized approval label."
                exit 1
              fi
            elif ! check_membership "${latest_actor}"; then
              echo "::error::${latest_actor}'s approval label could not be authorized."
              exit 1
            fi

            echo "::notice::The approval label is absent after an authorized removal."
            exit 0
          fi

          if [[ "${latest_action}" != "labeled" || -z "${latest_event_id}" || -z "${latest_actor}" ]]; then
            fail_closed_remove "The approval label is present, but its latest label event could not be established."
          fi

          if has_marker "${latest_event_id}"; then
            echo "::notice::The present approval label has a valid marker from a successful membership check."
            exit 0
          fi

          prior_unlabeled_id=$(jq -r 'if length >= 2 and .[-2].event == "unlabeled" then .[-2].id else empty end' <<<"${events}")
          if [[ "${latest_actor}" == "github-actions[bot]" && -n "${prior_unlabeled_id}" ]]; then
            prior_authorized_add=$(jq -r '[.[:-2][] | select(.event == "labeled")][-1].id // empty' <<<"${events}")
            if [[ -n "${prior_authorized_add}" ]] && has_marker "${prior_authorized_add}"; then
              if write_marker "${latest_event_id}"; then
                echo "::notice::Recovered the authorization marker for a restored, previously authorized approval."
                exit 0
              fi
            fi
          fi

          if check_membership "${latest_actor}"; then
            if write_marker "${latest_event_id}"; then
              echo "::notice::${latest_actor} is an active member of ansible/ansible-staff-eng-leads; the current approval label is authorized."
              exit 0
            fi
            echo "::error::Membership was verified, but the authorization marker could not be recorded."
            exit 1
          fi

          echo "::error::${latest_actor}'s approval label could not be authorized."
          if remove_label; then
            echo "::notice::Removed the approval label because its authorization could not be established."
          else
            echo "::error::Could not remove the unauthorized approval label; the check remains failed."
          fi
          exit 1
