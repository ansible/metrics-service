---
name: Framework Validation
on:
  pull_request:
  push:
    branches:
      - devel
      - main
      - 'stable**'
      - 'release**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v7
      - name: Validate framework
        run: |
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          ORG="${{ github.event.pull_request.base.repo.owner.login || github.repository_owner }}"
          uvx --refresh git+https://github.com/${ORG}/platform-service-framework@${BRANCH} validate