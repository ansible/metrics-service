---
name: Sync OpenAPI Spec

on:
  push:
    branches:
      - devel
      - stable-2.6
      - stable-2.7
    paths:
      - "apps/**/*.py"
      - "apps/**/serializers.py"
      - "apps/**/viewsets/**"
      - "apps/**/views/**"
  workflow_dispatch:  # allow manual trigger

jobs:
  generate:
    name: Generate and validate OpenAPI spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout metrics-service
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate and validate OpenAPI schema
        env:
          DJANGO_SETTINGS_MODULE: metrics_service.settings
          METRICS_SERVICE_SECRET_KEY: "ci-placeholder-not-secret"
          # Use SQLite in memory so Django starts up without a real postgres instance
          METRICS_SERVICE_DATABASES__default__ENGINE: django.db.backends.sqlite3
          METRICS_SERVICE_DATABASES__default__NAME: ":memory:"
          METRICS_SERVICE_DATABASES__awx__ENGINE: django.db.backends.sqlite3
          METRICS_SERVICE_DATABASES__awx__NAME: ":memory:"
        run: |
          uv run --frozen python manage.py spectacular \
            --color \
            --file metrics.json \
            --validate \
            --format openapi-json

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-openapi-spec
          path: metrics.json
          retention-days: 1

  sync:
    name: Sync OpenAPI spec to aap-openapi-specs
    needs: generate
    runs-on: ubuntu-latest
    if: github.repository == 'ansible-automation-platform/metrics-service'

    steps:
      - name: Download schema artifact
        uses: actions/download-artifact@v4
        with:
          name: metrics-openapi-spec

      - name: Checkout aap-openapi-specs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ansible-automation-platform/aap-openapi-specs
          token: ${{ secrets.AAP_OPENAPI_SPECS_PAT }}
          path: aap-openapi-specs
          ref: ${{ github.ref_name }}

      - name: Copy generated schema into aap-openapi-specs
        run: cp metrics.json aap-openapi-specs/metrics.json

      - name: Check for changes in aap-openapi-specs
        id: check_changes
        working-directory: aap-openapi-specs
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR branch in aap-openapi-specs
        if: steps.check_changes.outputs.has_changes == 'true'
        working-directory: aap-openapi-specs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/update-metrics-${{ github.ref_name }}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add metrics.json
          git commit -m "chore(sync): update metrics-service OpenAPI spec (${{ github.ref_name }})

          Automated sync from ${{ github.repository }}@${{ github.sha }}"
          git push origin "$BRANCH"
          echo "SYNC_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Open PR in aap-openapi-specs
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AAP_OPENAPI_SPECS_PAT }}
          GH_REPO: ansible-automation-platform/aap-openapi-specs
        run: |
          gh pr create \
            --repo "$GH_REPO" \
            --title "chore(sync): update metrics-service OpenAPI spec (${{ github.ref_name }})" \
            --body "## Summary

          This PR syncs the latest OpenAPI spec from [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}) into this repository.

          **Source commit:** ${{ github.repository }}@${{ github.sha }}
          **Branch:** \`${{ github.ref_name }}\`
          **Triggered by:** push to \`${{ github.ref_name }}\`

          > Automated sync via GitHub Actions ([workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))" \
            --base ${{ github.ref_name }} \
            --head "$SYNC_BRANCH"
