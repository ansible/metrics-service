---
# Dispatcherd Configuration for Metrics Service
# This configuration enables task scheduling and execution across processes
#
# NOTE: Database connection settings are automatically loaded from Django's
# DATABASES["default"] configuration at runtime. This allows proper support
# for METRICS_SERVICE_DATABASES__default__* environment variables.
# Do NOT add hardcoded database credentials here.

version: 2

brokers:
  pg_notify:
    # Database config is injected at runtime from Django settings
    # See apps/tasks/dispatcherd_config.py::_load_config_with_django_db()

    channels:
      - 'dashboard'
      - 'maintenance'
      - 'metrics'

service:
  pool_kwargs:
    max_workers: 4

  # Task execution settings
  task_settings:
    default_timeout: 3600 # overridden at runtime by TASK_TIMEOUT setting
    max_retries: 3
    retry_delay: 30 # 30 seconds between retries

# Worker class. Worker children are forked by the dispatcherd service process, so
# the runtime log level refresh thread is started post-fork in each child
# (on_start) rather than in the parent (AAP-79584).
worker:
  worker_cls: 'apps.tasks.dispatcherd_worker.LogLevelSyncWorker'

# Logging
# dispatcherd 2026.1.x DispatcherSettings ignores a `logging:` block in this
# file, so there is no per-component level to set here. In metrics-service the
# worker is started by `manage.py run_dispatcherd`, which inherits Django's
# logger configuration; the root logger is already at LOG_LEVEL
# (METRICS_SERVICE_LOG_LEVEL). Standalone `dispatcherd` CLI use configures
# logging through its own --log-level flag.

# NOTE: Queue routing is handled in apps/tasks/tasks.py::get_queue_for_function()
