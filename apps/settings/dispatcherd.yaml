---
# Dispatcherd Configuration for Metrics Service
# This configuration enables task scheduling and execution across processes
#
# SQL Server broker settings are loaded from the independent
# DISPATCHERD_SQLSERVER Django setting at runtime. Do not add credentials here.

version: 2

brokers:
  sql_server:
    # Connection config is injected from METRICS_SERVICE_DISPATCHERD_SQLSERVER__*.
    # See apps/tasks/dispatcherd_config.py::_load_config_with_dispatcherd_settings().
    config: {}
    channels:
      - 'dashboard'
      - 'maintenance'
      - 'metrics'
    poll_interval_seconds: 0.25

service:
  pool_kwargs:
    max_workers: 4

  # Task execution settings
  task_settings:
    default_timeout: 3600 # overridden at runtime by TASK_TIMEOUT setting
    max_retries: 3
    retry_delay: 30 # 30 seconds between retries

# Logging configuration
logging:
  level: INFO
  format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'

# NOTE: Queue routing is handled in apps/tasks/tasks.py::get_queue_for_function()
